name: "CI: Schema Docs Drift"

# The generated schema reference (contributor-docs/.../reference/schema.md) is committed so
# that local builds work and schema changes show up as a reviewable diff. That only holds if
# the committed copy is never stale: this job regenerates it from the migrations and fails when
# the result differs. Same guarantee the OpenAPI spec gets on the Bot API site — the docs cannot
# drift from the code.
on:
  pull_request:
    paths:
      - 'src/main/resources/db/migration/**'
      - 'contributor-docs/src/content/docs/reference/schema.md'
      - 'contributor-docs/scripts/render-schema-doc.mjs'
      - 'scripts/generate-schema-docs.sh'
      - '.github/workflows/check-schema-docs.yaml'
  workflow_dispatch:

jobs:
  check:
    name: Regenerate and compare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup tbls
        # Third-party action, pinned to a reviewed commit rather than a mutable tag.
        uses: k1LoW/setup-tbls@f25e3d013a596865b2db90dac7ee19e9f15b5780 # v1.4.0
        with:
          # Keep in lockstep with the tbls pinned in mise.toml, so a laptop and a runner
          # introspect identically — a version skew would show up as phantom drift.
          version: 1.95.0

      - name: Regenerate the schema reference
        run: ./scripts/generate-schema-docs.sh

      - name: Fail if the committed page is stale
        run: |
          if ! git diff --exit-code -- contributor-docs/src/content/docs/reference/schema.md; then
            echo "::error file=contributor-docs/src/content/docs/reference/schema.md::\
          The committed schema reference does not match the migrations. \
          Run 'mise run contrib-docs:schema' and commit the result."
            exit 1
          fi
